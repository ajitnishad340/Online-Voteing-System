<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>
<style>
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a, #2563eb);
}
.card {
    width: 400px;
    max-width: 90%;
    background: white;
    padding: 35px;
    border-radius: 18px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.3);
}
.icon {
    text-align: center;
    font-size: 55px;
}
h1 {
    text-align: center;
    color: #111827;
}
.subtitle {
    text-align: center;
    color: #6b7280;
    margin-bottom: 25px;
}
.flash {
    padding: 12px;
    margin-bottom: 15px;
    border-radius: 8px;
    font-weight: bold;
}
.flash.danger {
    background: #fee2e2;
    color: #991b1b;
}
.flash.success {
    background: #dcfce7;
    color: #166534;
}
label {
    display: block;
    margin-bottom: 7px;
    font-weight: bold;
}
input {
    width: 100%;
    padding: 13px;
    margin-bottom: 18px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 15px;
}
button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}
.back {
    display: block;
    text-align: center;
    margin-top: 20px;
    text-decoration: none;
    color: #2563eb;
    font-weight: bold;
}
</style>
</head>
<body>

<div class="card">

<div class="icon">🔐</div>

<h1>Admin Login</h1>

<p class="subtitle">Online Voting System</p>

{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
            <div class="flash {{ category }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}
{% endwith %}

<form method="POST" action="{{ url_for('admin_login') }}">

<label>Admin Username</label>

<input
    type="text"
    name="username"
    placeholder="Enter admin username"
    required
>

<label>Admin Password</label>

<input
    type="password"
    name="password"
    placeholder="Enter admin password"
    required
>

<button type="submit">🔐 Login as Admin</button>

</form>

<a href="{{ url_for('login') }}" class="back">
← Back to Voter Login
</a>

</div>

</body>
</html>

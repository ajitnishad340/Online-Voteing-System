<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - Online Voting System</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #ff9933,
                    #ffffff,
                    #138808
                );
        }

        .container {
            width: 95%;
            max-width: 480px;

            background: white;

            padding: 30px;

            border-radius: 20px;

            box-shadow:
                0 15px 40px rgba(0,0,0,0.20);
        }

        .logo {
            text-align: center;
            font-size: 45px;
            margin-bottom: 5px;
        }

        h1 {
            text-align: center;

            margin: 5px 0;

            color: #222;
        }

        .subtitle {
            text-align: center;

            color: #666;

            margin-bottom: 25px;
        }

        label {
            display: block;

            font-weight: bold;

            margin-top: 15px;

            color: #333;
        }

        input {
            width: 100%;

            padding: 13px;

            margin-top: 7px;

            border: 1px solid #ccc;

            border-radius: 10px;

            font-size: 15px;

            outline: none;
        }

        input:focus {
            border-color: #ff9933;

            box-shadow:
                0 0 5px rgba(255,153,51,0.3);
        }

        .btn {
            width: 100%;

            padding: 14px;

            margin-top: 25px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    90deg,
                    #ff9933,
                    #138808
                );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .back {
            text-align: center;

            margin-top: 20px;
        }

        .back a {
            color: #1d4ed8;

            text-decoration: none;

            font-weight: bold;
        }

        .flash {
            padding: 12px;

            border-radius: 8px;

            margin-bottom: 15px;

            text-align: center;

            font-size: 14px;
        }

        .danger {
            background: #fee2e2;

            color: #991b1b;
        }

        .success {
            background: #dcfce7;

            color: #166534;
        }

        .warning {
            background: #fef3c7;

            color: #92400e;
        }

        @media (max-width: 500px) {

            .container {
                padding: 22px;
            }

            h1 {
                font-size: 24px;
            }

            .logo {
                font-size: 38px;
            }
        }

    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        🇮🇳
    </div>

    <h1>Forgot Password</h1>

    <div class="subtitle">
        Verify your registered voter details
    </div>


    <!-- FLASH MESSAGES -->

    {% with messages = get_flashed_messages(with_categories=true) %}

        {% if messages %}

            {% for category, message in messages %}

                <div class="flash {{ category }}">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <!-- FORGOT PASSWORD FORM -->

    <form
        method="POST"
        action="{{ url_for('forgot_password') }}"
    >

        <label for="name">
            Full Name
        </label>

        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your registered name"
            required
        >


        <label for="father_name">
            Father's Name
        </label>

        <input
            type="text"
            id="father_name"
            name="father_name"
            placeholder="Enter your father's name"
            required
        >


        <label for="email">
            Registered Email
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your registered email"
            required
        >


        <label for="mobile">
            Registered Mobile Number
        </label>

        <input
            type="tel"
            id="mobile"
            name="mobile"
            placeholder="Enter your 10-digit mobile number"
            maxlength="10"
            required
        >


        <label for="aadhaar">
            Aadhaar Number
        </label>

        <input
            type="text"
            id="aadhaar"
            name="aadhaar"
            placeholder="Enter your 12-digit Aadhaar number"
            maxlength="12"
            inputmode="numeric"
            required
        >


        <button
            type="submit"
            class="btn"
        >
            🔐 Submit Password Reset Request
        </button>

    </form>


    <div class="back">

        <a href="{{ url_for('login') }}">
            ← Back to Login
        </a>

    </div>

</div>

</body>
</html>
